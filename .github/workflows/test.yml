---
name: Tests

on:
  push:
    branches-ignore:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest
          package_json_file: NanoKVM-USB/desktop/package.json

      - name: Setup node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest
          cache: "pnpm"
          cache-dependency-path: NanoKVM-USB/desktop/pnpm-lock.yaml

      - name: Build
        run: |
          cd "NanoKVM-USB/browser/"
          pnpm install || true
          pnpm approve-builds esbuild
          pnpm build

      - name: Pack extension
        run: |
          cp -r NanoKVM-USB/browser/dist/* ./
          zip --recurse-paths nanokvm-usb-browser-extension.zip --exclude "NanoKVM-USB/*" -- *

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: "chrome-extension"
          path: "nanokvm-usb-browser-extension.zip"
