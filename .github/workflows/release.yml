---
name: Release

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment:
      name: "release"
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest
          package_json_file: NanoKVM-USB/desktop/package.json

      - name: Setup node.js
        uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: "pnpm"
          cache-dependency-path: NanoKVM-USB/desktop/pnpm-lock.yaml

      - name: Build
        run: |
          cd NanoKVM-USB/browser/
          pnpm install || true
          pnpm approve-builds esbuild
          pnpm build

      - name: Update version
        run: |
          tag="$(cd NanoKVM-USB && git describe --tags)"
          sed -i "s|%VERSION%|${tag/v}|" ./manifest.json

      - name: Pack extension
        run: |
          cp -r NanoKVM-USB/browser/dist/* ./
          zip --recurse-paths nanokvm-usb-browser-extension.zip --exclude "NanoKVM-USB/*" -- *

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: "chrome-extension"
          path: "nanokvm-usb-browser-extension.zip"

      - name: Upload extension to webstore
        env:
          CLIENT_ID: "${{ secrets.GOOGLE_CLIENT_ID }}"
          CLIENT_SECRET: "${{ secrets.GOOGLE_CLIENT_SECRET }}"
          REFRESH_TOKEN: "${{ secrets.GOOGLE_REFRESH_TOKEN }}"
        run: |
          pnpx chrome-webstore-upload-cli \
            --publisher-id '${{ vars.CHROME_PUBLISHER_ID }}' \
            --extension-id '${{ vars.CHROME_EXTENSION_ID }}' \
            --source nanokvm-usb-browser-extension.zip

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: "release"
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: "artifacts"

      - name: Stash artifacts
        run: |
          mkdir dist
          mv artifacts/* dist/

      - name: Calculate checksums
        run: |
          cd dist
          sha256sum -- * | tee sha256sums.txt

      - name: Get version
        id: get-version
        run: |
          cd NanoKVM-USB
          tag=$(git describe --tags)
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Create release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_name: "${{ steps.get-version.outputs.tag }}"
          tag: "${{ steps.get-version.outputs.tag }}"
          file: dist/*
          file_glob: true
          overwrite: true
